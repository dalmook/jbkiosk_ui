<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>점핑배틀 키오스크 UI 비교</title>
<style>
:root{--bg:#f1f3f7;--card:#fff;--ink:#171923;--sub:#72798b;--line:#dfe3eb;--p:#ff5733;--p2:#ff8a3d;--violet:#6651e8;--green:#17a673;--yellow:#f2aa12;--blue:#2f8fe5;--shadow:0 20px 55px rgba(31,39,61,.13)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg)}button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #6651e840;outline-offset:3px}.app{min-height:100vh;display:flex;flex-direction:column}.top{height:78px;padding:0 20px;background:#fff;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:11px}.logo{width:43px;height:43px;border-radius:14px;background:linear-gradient(145deg,var(--p),var(--p2));color:#fff;display:grid;place-items:center;font-size:23px;font-weight:1000;box-shadow:0 10px 24px #ff573345}.brand b{font-size:16px;letter-spacing:.12em}.brand small{display:block;color:var(--sub);font-size:10px;margin-top:3px;letter-spacing:0}.tabs{display:flex;padding:5px;background:#edf0f5;border-radius:999px;gap:4px}.tab{border:0;background:transparent;border-radius:999px;min-width:92px;height:45px;padding:0 13px;color:#7d8494;font-weight:900}.tab.active{background:#fff;color:var(--ink);box-shadow:0 5px 16px #2f35451c}.tab i{display:inline-grid;width:27px;height:27px;place-items:center;border-radius:50%;background:#fff;font-style:normal;margin-right:5px}.tab.active i{background:var(--p);color:#fff}.tools{justify-self:end;display:flex;align-items:center;gap:7px}.tool{border:1px solid var(--line);background:#fff;height:43px;padding:0 13px;border-radius:13px;font-weight:850;color:#505769}.time{font-size:18px;font-weight:1000;margin-right:7px}.progress{height:5px;background:#e0e4eb}.progress span{height:100%;display:block;width:0;background:linear-gradient(90deg,var(--p),var(--p2));transition:.25s}.stage{width:min(1130px,100%);margin:auto;flex:1;padding:44px 36px 120px}.kicker{font-size:13px;letter-spacing:.16em;color:var(--p);font-weight:1000;margin:0 0 10px}.title{font-size:clamp(39px,6vw,68px);line-height:1.05;letter-spacing:-.055em;margin:0}.title em{font-style:normal;color:var(--p)}.sub{color:var(--sub);font-size:18px;line-height:1.6;margin:18px 0 0}.hero{text-align:center;margin-bottom:30px}.hero .sub{margin-left:auto;margin-right:auto}.speed-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.big{border:0;border-radius:30px;min-height:330px;padding:30px;text-align:left;color:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:.16s}.big:hover{transform:translateY(-4px)}.big:after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;right:-75px;top:-80px;background:#ffffff1c}.big.res{background:linear-gradient(145deg,#5d46e5,#826cf2)}.big.walk{background:linear-gradient(145deg,#ff502d,#ff8141)}.big .ico{width:72px;height:72px;border-radius:22px;background:#ffffff28;display:grid;place-items:center;font-size:37px}.big small{display:block;margin-top:78px;font-size:14px;font-weight:850;opacity:.83}.big b{display:block;font-size:34px;letter-spacing:-.04em;margin-top:5px}.big strong{position:absolute;right:28px;bottom:25px;font-size:28px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:15px}.quick button{border:1px solid var(--line);background:#fff;border-radius:20px;min-height:94px;text-align:left;padding:16px 18px;font-weight:900}.quick span{font-size:24px;margin-right:8px}.quick small{display:block;color:var(--sub);font-weight:650;margin-top:7px}.current-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.plain-card{border:2px solid var(--line);background:#fff;border-radius:25px;min-height:260px;padding:24px;text-align:left;box-shadow:0 11px 28px #2d35400d}.plain-card:hover{border-color:var(--p)}.plain-card .ico{font-size:48px}.plain-card b{display:block;font-size:27px;margin-top:54px}.plain-card small{display:block;color:var(--sub);margin-top:9px;line-height:1.5}.issue{margin-top:18px;padding:18px 20px;background:#fff5ee;border:1px solid #ffd7c5;border-radius:19px;color:#9c4932;font-weight:750}.guide{display:grid;grid-template-columns:1.05fr .95fr;gap:20px}.guide-box,.character{border-radius:30px;padding:30px;min-height:455px}.guide-box{background:#fff;border:1px solid var(--line)}.answers{display:grid;gap:12px;margin-top:27px}.answer{border:2px solid var(--line);background:#fff;border-radius:20px;min-height:91px;padding:17px 20px;text-align:left}.answer:hover{border-color:var(--p)}.answer b{display:block;font-size:21px}.answer small{color:var(--sub)}.character{background:linear-gradient(155deg,#5740dc,#8876f5);color:#fff;display:flex;flex-direction:column;justify-content:space-between}.face{font-size:112px;filter:drop-shadow(0 18px 14px #25206d50)}.character b{font-size:31px;line-height:1.25}.live{display:grid;grid-template-columns:.82fr 1.18fr;gap:18px}.live-intro{border-radius:29px;padding:28px;background:linear-gradient(145deg,#11141b,#303746);color:#fff}.live-intro .sub{color:#c9ced8}.rooms{display:grid;grid-template-columns:1fr 1fr;gap:12px}.room{border:2px solid var(--line);background:#fff;border-radius:23px;padding:19px;text-align:left;min-height:180px}.room:hover{border-color:var(--blue)}.room b{font-size:31px}.room small{display:block;color:var(--sub);margin-top:3px}.status{display:flex;align-items:center;gap:9px;margin-top:22px;font-weight:900}.dot{width:11px;height:11px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px #17a6731d}.busy .dot{background:#ff7741;box-shadow:0 0 0 5px #ff77411d}.room strong{display:block;color:var(--p);margin-top:17px}.family{background:linear-gradient(145deg,#fff8e5,#fff);border:1px solid #ffe09c;border-radius:30px;padding:30px}.family-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:27px}.family-card{border:2px solid transparent;background:#fff;border-radius:25px;min-height:245px;padding:22px;text-align:left;box-shadow:0 13px 30px #80641b14}.family-card:hover{border-color:var(--yellow)}.family-card .ico{font-size:57px}.family-card b{display:block;font-size:25px;margin-top:47px}.family-card small{display:block;color:var(--sub);line-height:1.5;margin-top:8px}.step-head{margin-bottom:25px}.step-head h2{font-size:43px;letter-spacing:-.045em;margin:0}.step-head p{color:var(--sub);font-size:17px;line-height:1.6}.panel{background:#fff;border:1px solid var(--line);border-radius:25px;padding:23px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.counter{display:flex;justify-content:space-between;align-items:center;padding:19px 0;border-bottom:1px solid var(--line)}.counter:last-child{border-bottom:0}.counter b{display:block;font-size:21px}.counter small{color:var(--sub)}.ctrl{display:flex;align-items:center;gap:14px}.ctrl button{width:54px;height:54px;border:1px solid var(--line);background:#f6f7fa;border-radius:16px;font-size:25px;font-weight:1000}.ctrl strong{font-size:25px;min-width:30px;text-align:center}.summary-number{font-size:50px;font-weight:1000;color:var(--p);margin:14px 0}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.pick{border:2px solid var(--line);background:#fff;border-radius:22px;min-height:155px;padding:18px;text-align:left}.pick.on{border-color:var(--p);background:#fff6f2;box-shadow:0 0 0 4px #ff573311}.pick b{display:block;font-size:21px}.pick small{display:block;color:var(--sub);line-height:1.45;margin-top:8px}.pick strong{display:block;color:var(--p);margin-top:14px}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.level{border:2px solid var(--line);background:#fff;border-radius:20px;min-height:137px;padding:16px;text-align:left}.level.on{border-color:var(--violet);background:#f5f2ff}.level b{display:block;font-size:19px}.stars{color:#ffac14;margin-top:9px;letter-spacing:1px}.level small{display:block;color:var(--sub);margin-top:8px}.review{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.line{display:flex;justify-content:space-between;gap:20px;padding:15px 0;border-bottom:1px solid var(--line)}.line span{color:var(--sub)}.total{display:flex;justify-content:space-between;align-items:end;padding-top:24px}.total strong{font-size:34px;color:var(--p)}.safe{display:grid;gap:11px;margin-top:15px}.safe div{padding:17px;background:#f5f7fa;border-radius:17px}.safe b{display:block}.safe small{color:var(--sub)}.done{text-align:center;padding:50px 10px}.check{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#fff;font-size:60px;font-weight:1000;margin:auto;box-shadow:0 20px 45px #17a6733d}.done h2{font-size:47px;margin:25px 0 9px}.ticket{max-width:710px;margin:30px auto;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--line);border-radius:24px;padding:23px;box-shadow:var(--shadow)}.ticket div{border-right:1px solid var(--line)}.ticket div:last-child{border:0}.ticket small{display:block;color:var(--sub)}.ticket b{display:block;font-size:25px;margin-top:6px}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fffffff2;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:13px max(22px,calc((100vw - 1058px)/2));display:flex;align-items:center;justify-content:space-between;z-index:30}.bottom.hide{display:none}.back{border:1px solid var(--line);background:#fff;border-radius:16px;min-height:59px;padding:0 25px;font-weight:900}.next{border:0;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:16px;min-height:59px;padding:0 35px;font-weight:1000;box-shadow:0 12px 26px #ff573335}.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:#171923;color:#fff;padding:15px 21px;border-radius:15px;font-weight:850;z-index:50;box-shadow:var(--shadow)}@media(max-width:900px){.top{grid-template-columns:1fr auto}.tabs{grid-column:1/-1;grid-row:2;margin:6px auto}.top{height:auto;padding:10px 14px}.tools .time{display:none}.tab{min-width:auto}.tab span{display:none}.stage{padding:85px 18px 110px}.speed-grid,.guide,.live,.two,.review{grid-template-columns:1fr}.current-grid,.family-grid,.grid3,.levels{grid-template-columns:1fr 1fr}.big{min-height:270px}.big small{margin-top:45px}}@media(max-width:560px){.brand small,.tool:not(:last-child){display:none}.current-grid,.family-grid,.rooms,.grid3,.levels{grid-template-columns:1fr}.title{font-size:41px}.ticket{grid-template-columns:1fr 1fr;gap:18px}.ticket div{border:0}.tab{padding:0 8px}.stage{padding-top:75px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div class="logo">⚡</div><div><b>JUMPING BATTLE</b><small>키오스크 UI 비교 프로토타입</small></div></div><nav class="tabs" id="tabs"></nav><div class="tools"><span class="time" id="clock">--:--</span><button class="tool" onclick="resetFlow()">↻ 처음</button><button class="tool" onclick="toast('직원을 호출했어요')">? 도움</button></div></header>
<div class="progress"><span id="progress"></span></div>
<main class="stage" id="screen"></main>
<footer class="bottom hide" id="bottom"><button class="back" onclick="back()">← 이전</button><button class="next" id="next" onclick="next()">다음 →</button></footer>
</div>
<script>
const concepts={current:['현재 UI','기존 흐름'],speed:['A 속도형','최소 터치'],guided:['B 안내형','초보 친화'],live:['C 현황형','방 우선'],family:['D 가족형','그룹 중심']};
const levels=[['easy','입문','★☆☆☆☆','처음 방문·어린이'],['basic','베이직','★★☆☆☆','가볍게 즐기기'],['normal','노멀','★★★☆☆','가장 인기'],['active','액티브','★★★☆☆','운동량 증가'],['hard','하드','★★★★☆','숙련자 추천'],['extreme','익스트림','★★★★★','최고 난도'],['kids','키즈','★☆☆☆☆','어린이 전용'],['team','팀전','★★★☆☆','협동 플레이'],['random','랜덤','?','자동 추천']];
let s={concept:'speed',step:'home',flow:'walk',adults:1,kids:1,room:'small',time:'지금 바로',level:'normal'};
const steps=['home','people','room','level','review','done'];
const $=q=>document.querySelector(q),money=n=>n.toLocaleString('ko-KR')+'원';
function tabs(){let h='';Object.entries(concepts).forEach(([k,v],i)=>h+=`<button class="tab ${s.concept===k?'active':''}" onclick="switchConcept('${k}')"><i>${i?String.fromCharCode(64+i):'현'}</i><span>${v[0]}</span></button>`);$('#tabs').innerHTML=h}
function switchConcept(k){s.concept=k;s.step='home';render()}
function resetFlow(){s={...s,step:'home',flow:'walk',adults:1,kids:1,room:'small',time:'지금 바로',level:'normal'};render()}
function start(flow){s.flow=flow;s.step='people';render()}
function head(k,t,d){return `<div class="hero"><p class="kicker">${k}</p><h1 class="title">${t}</h1><p class="sub">${d}</p></div>`}
function home(){if(s.concept==='current')return head('CURRENT KIOSK','현재 화면의 <em>시작 구조</em>','회원 여부를 먼저 묻는 기존 방식을 비교해보세요.')+`<div class="current-grid"><button class="plain-card" onclick="start('member')"><div class="ico">👤</div><b>회원 이용</b><small>휴대폰 번호와 비밀번호를 입력합니다.</small></button><button class="plain-card" onclick="start('guest')"><div class="ico">🎟️</div><b>비회원 이용</b><small>현장 이용 정보를 처음부터 입력합니다.</small></button><button class="plain-card" onclick="start('reservation')"><div class="ico">📅</div><b>예약 확인</b><small>예약 고객이 별도 메뉴를 찾아야 합니다.</small></button></div><div class="issue">비교 포인트 · 처음 방문한 고객은 회원/비회원보다 “예약했는지, 지금 이용할지”를 먼저 이해하기 쉽습니다.</div>`;
if(s.concept==='guided')return `<div class="guide"><section class="guide-box"><p class="kicker">STEP 1 · 방문 확인</p><h1 class="title" style="font-size:52px">예약이<br>있으신가요?</h1><p class="sub">한 화면에서 한 가지만 물어보는 안내형입니다.</p><div class="answers"><button class="answer" onclick="start('reservation')"><b>네, 예약했어요</b><small>휴대폰 번호로 오늘 예약을 확인해요</small></button><button class="answer" onclick="start('walk')"><b>아니요, 현장 방문이에요</b><small>가장 빠른 방을 찾아드려요</small></button></div></section><section class="character"><div class="face">🙌</div><div><small>처음이어도 괜찮아요</small><b>어려운 말 없이<br>하나씩 안내할게요.</b></div></section></div>`;
if(s.concept==='live')return `<div class="live"><section class="live-intro"><p class="kicker" style="color:#77e5c0">LIVE ROOM</p><h1 class="title" style="font-size:50px">지금 가능한<br>방부터 고르세요.</h1><p class="sub">현장 방문이 많은 매장에 적합한 실시간 현황형입니다.</p><button class="next" style="margin-top:25px" onclick="start('reservation')">예약 고객이에요 →</button></section><section class="rooms">${[['A1','소형','바로 이용',0],['C1','소형','바로 이용',0],['C2','중형','12분 후',1],['B1','대형','25분 후',1]].map(r=>`<button class="room ${r[3]?'busy':''}" onclick="s.room='${r[0]==='B1'?'large':r[0]==='C2'?'medium':'small'}';start('walk')"><b>${r[0]}</b><small>${r[1]}방</small><div class="status"><i class="dot"></i>${r[3]?'이용 중':'이용 가능'}</div><strong>${r[2]} →</strong></button>`).join('')}</section></div>`;
if(s.concept==='family')return `<section class="family">${head('FAMILY & GROUP','누구와 <em>함께</em> 왔나요?','구성에 맞는 방과 난이도를 먼저 추천하는 가족·단체 중심형입니다.')}<div class="family-grid"><button class="family-card" onclick="s.adults=2;s.kids=2;start('walk')"><div class="ico">👨‍👩‍👧‍👦</div><b>가족끼리</b><small>아이와 어른이 함께 즐기는 추천 구성을 보여줘요.</small></button><button class="family-card" onclick="s.adults=4;s.kids=0;start('walk')"><div class="ico">🧑‍🤝‍🧑</div><b>친구끼리</b><small>빠르고 신나는 인기 난이도를 추천해요.</small></button><button class="family-card" onclick="s.adults=2;s.kids=6;s.room='large';start('party')"><div class="ico">🎂</div><b>생일·단체</b><small>대형방과 그룹 플레이를 우선 제안해요.</small></button></div></section>`;
return head('SELF SERVICE KIOSK','선택은 짧게,<br><em>게임은 바로.</em>','예약 확인 또는 현장 이용을 먼저 선택하는 속도 최우선형입니다.')+`<div class="speed-grid"><button class="big res" onclick="start('reservation')"><div class="ico">📅</div><small>온라인·전화 예약 고객</small><b>예약 확인하고<br>바로 시작</b><strong>→</strong></button><button class="big walk" onclick="start('walk')"><div class="ico">⚡</div><small>지금 방문한 고객</small><b>현장에서<br>새로 이용</b><strong>→</strong></button></div><div class="quick"><button onclick="toast('최근 이용을 불러왔어요')"><span>↻</span>한 게임 더<small>방금 게임 재이용</small></button><button onclick="toast('주차 등록 화면입니다')"><span>🚗</span>주차 등록<small>차량번호 뒤 4자리</small></button><button onclick="toast('직원에게 알림을 보냈어요')"><span>🔔</span>직원 호출<small>도움 요청</small></button></div>`}
function counter(k,label,price){return `<div class="counter"><div><b>${label}</b><small>1인 ${money(price)}</small></div><div class="ctrl"><button onclick="count('${k}',-1)">−</button><strong>${s[k]}</strong><button onclick="count('${k}',1)">＋</button></div></div>`}
function people(){let n=s.adults+s.kids;return `<div class="step-head"><p class="kicker">STEP 1 · 이용 인원</p><h2>몇 명이 이용하나요?</h2><p>실제로 게임에 참여하는 인원을 선택해주세요. 최대 10명입니다.</p></div><div class="two"><section class="panel">${counter('adults','성인',7000)}${counter('kids','청소년·어린이',5000)}</section><section class="panel"><p class="kicker">현재 선택</p><div class="summary-number">총 ${n}명</div><p class="sub" style="font-size:16px">${n<=3?'소형방도 편하게 이용할 수 있어요.':n<=6?'중형방이 가장 쾌적해요.':'대형방을 추천해요.'}</p><div class="line"><span>예상 게임비</span><b>${money(s.adults*7000+s.kids*5000)}</b></div></section></div>`}
function count(k,d){if(d>0&&s.adults+s.kids>=10)return toast('최대 10명까지 선택할 수 있어요');s[k]=Math.max(0,s[k]+d);if(s.adults+s.kids===0)s[k]=1;render()}
function room(){let n=s.adults+s.kids,rec=n<=3?'small':n<=6?'medium':'large';return `<div class="step-head"><p class="kicker">STEP 2 · 방과 시간</p><h2>방과 시간을 골라주세요</h2><p>인원에 맞는 추천 방을 표시했습니다. 방 크기에 따른 추가요금은 없습니다.</p></div><div class="grid3">${[['small','소형방','1~3명 추천'],['medium','중형방','3~6명 추천'],['large','대형방','5~10명 추천']].map(r=>`<button class="pick ${s.room===r[0]?'on':''}" onclick="s.room='${r[0]}';render()"><b>${r[1]}</b><small>${r[2]}</small><strong>${rec===r[0]?'★ 가장 추천':'선택 가능'}</strong></button>`).join('')}</div><h3 style="font-size:23px;margin:29px 0 13px">이용 시작 시간</h3><div class="grid3">${['지금 바로','15분 후','30분 후'].map(t=>`<button class="pick ${s.time===t?'on':''}" onclick="s.time='${t}';render()"><b>${t}</b><small>${t==='지금 바로'?'가장 빠른 방 자동 배정':'선택 시간까지 방을 준비해요'}</small><strong>${t==='지금 바로'?'대기 없음':'예약 가능'}</strong></button>`).join('')}</div>`}
function level(){return `<div class="step-head"><p class="kicker">STEP 3 · 난이도</p><h2>오늘의 난이도를 골라주세요</h2><p>처음이라면 베이직 또는 노멀을 추천합니다. 9개 난이도를 한 화면에서 비교할 수 있어요.</p></div><div class="levels">${levels.map(l=>`<button class="level ${s.level===l[0]?'on':''}" onclick="s.level='${l[0]}';render()"><b>${l[1]}</b><div class="stars">${l[2]}</div><small>${l[3]}</small></button>`).join('')}</div>`}
function review(){let room={small:'소형방',medium:'중형방',large:'대형방'}[s.room],lv=levels.find(x=>x[0]===s.level)[1],total=s.adults*7000+s.kids*5000;return `<div class="step-head"><p class="kicker">FINAL CHECK</p><h2>선택 내용을 확인해주세요</h2><p>잘못된 항목은 이전 버튼으로 돌아가 수정할 수 있습니다.</p></div><div class="review"><section class="panel"><div class="line"><span>이용 구분</span><b>${s.flow==='reservation'?'예약 이용':s.flow==='party'?'단체 이용':'현장 이용'}</b></div><div class="line"><span>이용 인원</span><b>성인 ${s.adults} · 아이 ${s.kids}</b></div><div class="line"><span>방과 시간</span><b>${room} · ${s.time}</b></div><div class="line"><span>난이도</span><b>${lv}</b></div><div class="total"><span>결제 예정 금액</span><strong>${money(total)}</strong></div></section><section class="panel"><p class="kicker">안전 이용 확인</p><h3 style="font-size:24px;margin-top:0">결제 전 필수 안내</h3><div class="safe"><div><b>✓ 준비운동 후 이용</b><small>무리한 동작은 피해주세요.</small></div><div><b>✓ 직원 안내 준수</b><small>안전 수칙을 확인했습니다.</small></div><div><b>✓ 중복 결제 방지</b><small>처리 중 버튼은 자동으로 잠깁니다.</small></div></div></section></div>`}
function done(){let room={small:'A1',medium:'C2',large:'B1'}[s.room],lv=levels.find(x=>x[0]===s.level)[1];return `<section class="done"><div class="check">✓</div><h2>이용 준비가 완료됐어요!</h2><p class="sub">실제 운영 연결 전 UI 프로토타입입니다.<br>선택한 흐름과 화면 구성을 비교해주세요.</p><div class="ticket"><div><small>배정 방</small><b>${room}</b></div><div><small>입장 시간</small><b>${s.time}</b></div><div><small>난이도</small><b>${lv}</b></div><div><small>인원</small><b>${s.adults+s.kids}명</b></div></div><button class="next" onclick="resetFlow()">다른 시안 다시 보기</button></section>`}
function next(){let i=steps.indexOf(s.step);if(i<steps.length-1){s.step=steps[i+1];render()}}
function back(){let i=steps.indexOf(s.step);s.step=steps[Math.max(0,i-1)];render()}
function toast(m){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2100)}
function render(){tabs();let i=steps.indexOf(s.step);$('#progress').style.width=(i/(steps.length-1)*100)+'%';$('#screen').innerHTML=s.step==='home'?home():s.step==='people'?people():s.step==='room'?room():s.step==='level'?level():s.step==='review'?review():done();$('#bottom').classList.toggle('hide',s.step==='home'||s.step==='done');if(s.step==='review')$('#next').textContent='결제 화면 확인 →';else $('#next').textContent='선택 완료 →';scrollTo({top:0,behavior:'smooth'})}
setInterval(()=>$('#clock').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}),1000);render();
</script>
</body>
</html>
